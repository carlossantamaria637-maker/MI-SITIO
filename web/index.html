<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Bienvenida</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:linear-gradient(135deg,#7B2CBF,#9D4EDD,#C77DFF);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.contenedor{
    width:500px;
    background:white;
    padding:40px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 15px 35px rgba(0,0,0,.25);
}

h2{
    color:#6A0DAD;
    margin-bottom:15px;
    font-size:34px;
}

p{
    color:#555;
    font-size:20px;
    margin-bottom:50px;
}

button{
    background:#8A2BE2;
    color:white;
    border:none;
    padding:18px 50px;
    font-size:22px;
    border-radius:50px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#6A0DAD;
    transform:scale(1.08);
}

</style>

</head>

<body>

<div class="contenedor">

    <p>Tal vez así no puedes romperla, loquis loquis. 💜</p>

    <h2>Bienvenido</h2>

    <button onclick="window.location.href='pagina2.html'">
        Comenzar
    </button>

</div>

</body>
</html>
